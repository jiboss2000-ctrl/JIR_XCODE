---
- name: Deploy VS Code settings
  hosts: all
  become: yes

  vars:
    # Defaults (override via environment or extra-vars)
    FONT_FAMILY: "Fira Code, Monaco, Menlo, 'Courier New', monospace"
    FONT_SIZE: 12
    FONT_WEIGHT: "normal"
    THEME_NAME: "Monokai"
    THEME_COLORS:
      - "#2B2B2B"
      - "#F8F8F2"
    EXTENSIONS:
      - "ms-python.python"
      - "vscjava.vscode-java-pack"
      - "esbenp.prettier-vscode"
      - "dbaeumer.vscode-eslint"
      - "eamodio.gitlens"
      - "ms-azuretools.vscode-docker"
    # Deployment target host (set this to your production host)
    DEPLOY_TARGET: "prod.example.com"

  tasks:
    - name: Ensure .vscode directory exists
      file:
        path: "{{ ansible_env.HOME }}/.vscode"
        state: directory
        mode: '0755'

    - name: Deploy VS Code settings (rendered from template)
      template:
        src: templates/vscode-settings.j2
        dest: "{{ ansible_env.HOME }}/.vscode/settings.json"
        mode: '0644'
      vars:
        env:
          FONT_FAMILY: "{{ lookup('env','FONT_FAMILY') | default(FONT_FAMILY) }}"
          FONT_SIZE: "{{ lookup('env','FONT_SIZE') | default(FONT_SIZE) }}"
          FONT_WEIGHT: "{{ lookup('env','FONT_WEIGHT') | default(FONT_WEIGHT) }}"
          THEME_NAME: "{{ lookup('env','THEME_NAME') | default(THEME_NAME) }}"
          THEME_COLORS: {{ lookup('env','THEME_COLORS') | default(THEME_COLORS) }}
          EXTENSION_1: "{{ lookup('env','EXTENSION_1') | default(EXTENSIONS[0]) }}"
          EXTENSION_2: "{{ lookup('env','EXTENSION_2') | default(EXTENSIONS[1]) }}"
          EXTENSION_3: "{{ lookup('env','EXTENSION_3') | default(EXTENSIONS[2]) }}"
          EXTENSION_4: "{{ lookup('env','EXTENSION_4') | default(EXTENSIONS[3]) }}"
          EXTENSION_5: "{{ lookup('env','EXTENSION_5') | default(EXTENSIONS[4]) }}"
          EXTENSION_6: "{{ lookup('env','EXTENSION_6') | default(EXTENSIONS[5]) }}"

    - name: Deploy recommended extensions file
      copy:
        dest: "{{ ansible_env.HOME }}/.vscode/extensions.json"
        content: |
          {
            "recommendations": [
              "ms-python.python",
              "vscjava.vscode-java-pack",
              "esbenp.prettier-vscode",
              "dbaeumer.vscode-eslint",
              "eamodio.gitlens",
              "ms-azuretools.vscode-docker"
            ]
          }
        mode: '0644'

    - name: (Optional) Install VS Code extensions via code CLI if available
      become: no
      shell: |
        if command -v code >/dev/null 2>&1; then
          for ext in ms-python.python vscjava.vscode-java-pack esbenp.prettier-vscode dbaeumer.vscode-eslint eamodio.gitlens ms-azuretools.vscode-docker; do
            code --install-extension "$ext" || true
          done
        fi
      args:
        executable: /bin/bash

    - name: (Optional) Print deployment target
      debug:
        msg: "Deployment target configured as {{ DEPLOY_TARGET }}"

  # Example of using vault/lookup for secrets (do NOT store secrets in repo)
  # To use a token, set it as an environment variable or Ansible vault entry and
  # access with lookup('env','DEPLOY_TOKEN') or vars_prompt / vault.
